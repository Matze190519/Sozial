<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LR Präsentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.1) 0%, rgba(0, 0, 0, 1) 60%);
        }
        .frame-wrapper {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 aspect ratio */
            max-width: 1280px;
            max-height: 720px;
            overflow: visible;
            border-radius: 8px;
            /* Glow effect - works on all devices */
            -webkit-box-shadow: 0 0 40px rgba(255, 255, 255, 0.5), 0 0 80px rgba(255, 255, 255, 0.3), 0 0 120px rgba(255, 255, 255, 0.2);
            -moz-box-shadow: 0 0 40px rgba(255, 255, 255, 0.5), 0 0 80px rgba(255, 255, 255, 0.3), 0 0 120px rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.5), 0 0 80px rgba(255, 255, 255, 0.3), 0 0 120px rgba(255, 255, 255, 0.2);
        }
        .slide-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 8px;
            background: black;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 1280px;
            height: 720px;
            border: none;
            background: black;
            transform-origin: top left;
            pointer-events: none;
        }
        .touch-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: transparent;
        }
        .nav-button {
            display: none;
        }
        .slide-counter {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: #ffd700;
            z-index: 1000;
        }
        .fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            z-index: 1000;
            opacity: 0.5;
            transition: all 0.3s;
        }
        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            opacity: 1;
        }
        
        /* Mobile specific styles */
        @media (max-width: 768px) {
            .frame-wrapper {
                -webkit-box-shadow: 0 0 30px rgba(255, 255, 255, 0.6), 0 0 60px rgba(255, 255, 255, 0.4);
                -moz-box-shadow: 0 0 30px rgba(255, 255, 255, 0.6), 0 0 60px rgba(255, 255, 255, 0.4);
                box-shadow: 0 0 30px rgba(255, 255, 255, 0.6), 0 0 60px rgba(255, 255, 255, 0.4);
            }
            .slide-counter {
                bottom: 10px;
                right: 10px;
                font-size: 12px;
                padding: 6px 12px;
            }
            .fullscreen-btn {
                top: 10px;
                right: 10px;
                padding: 8px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="nav-button prev" onclick="prevSlide()">◀</button>
        <div class="frame-wrapper">
            <div class="slide-container">
                <iframe id="slideFrame" src=""></iframe>
            </div>
            <div class="touch-overlay" id="touchOverlay"></div>
        </div>
        <button class="nav-button next" onclick="nextSlide()">▶</button>
        <div class="slide-counter">
            <span id="currentSlide">1</span> / <span id="totalSlides">40</span>
        </div>
        <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ Vollbild</button>
    </div>

    <script>
        const slides = [
            'folie_01',
            'folie_02',
            'folie_03',
            'folie_04',
            'folie_06',
            'folie_07',
            'folie_08',
            'folie_09',
            'folie_10',
            'folie_11',
            'folie_13',
            'folie_12',
            'folie_14',
            'folie_17',
            'folie_19b',
            'folie_19',
            'folie_16b',
            'folie_20',
            'folie_21',
            'folie_22',
            'folie_23',
            'folie_24',
            'folie_25',
            'folie_26',
            'folie_27',
            'folie_28',
            'folie_28a',
            'folie_29',
            'folie_30',
            'folie_31',
            'folie_32',
            'folie_33',
            'folie_34',
            'folie_35',
            'folie_36',
            'folie_37',
            'folie_39',
            'folie_41',
            'folie_42'
        ];

        let currentIndex = 0;

        function loadSlide(index) {
            const slideId = slides[index];
            document.getElementById('slideFrame').src = `${slideId}.html`;
            document.getElementById('currentSlide').textContent = index + 1;
            document.getElementById('totalSlides').textContent = slides.length;
            window.location.hash = slideId;
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                loadSlide(currentIndex);
            }
        }

        function nextSlide() {
            if (currentIndex < slides.length - 1) {
                currentIndex++;
                loadSlide(currentIndex);
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevSlide();
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'f' || e.key === 'F') toggleFullscreen();
        });

        // Touch swipe navigation - on the overlay
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;
        const touchOverlay = document.getElementById('touchOverlay');

        touchOverlay.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
            e.preventDefault();
        }, { passive: false });

        touchOverlay.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });

        touchOverlay.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;
            const deltaTime = Date.now() - touchStartTime;
            const threshold = 30;

            // Swipe detection
            if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > threshold && deltaTime < 500) {
                if (deltaX > 0) {
                    prevSlide();
                } else {
                    nextSlide();
                }
            }
            // Tap detection (for next slide)
            else if (Math.abs(deltaX) < 10 && Math.abs(deltaY) < 10 && deltaTime < 300) {
                // Tap on right half = next, left half = prev
                const tapX = touchEndX;
                const screenWidth = window.innerWidth;
                if (tapX > screenWidth / 2) {
                    nextSlide();
                } else {
                    prevSlide();
                }
            }
            e.preventDefault();
        }, { passive: false });

        // Also listen on container for touches outside the slide
        const container = document.querySelector('.container');
        container.addEventListener('touchstart', (e) => {
            if (e.target === container) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchStartTime = Date.now();
            }
        }, { passive: true });

        container.addEventListener('touchend', (e) => {
            if (e.target === container) {
                const touchEndX = e.changedTouches[0].clientX;
                const deltaX = touchEndX - touchStartX;
                const deltaTime = Date.now() - touchStartTime;
                
                if (Math.abs(deltaX) > 30 && deltaTime < 500) {
                    if (deltaX > 0) {
                        prevSlide();
                    } else {
                        nextSlide();
                    }
                }
            }
        }, { passive: true });

        // Scale iframe for all devices
        function scaleIframe() {
            const wrapper = document.querySelector('.frame-wrapper');
            const iframe = document.getElementById('slideFrame');
            const wrapperWidth = wrapper.offsetWidth;
            const scale = wrapperWidth / 1280;
            iframe.style.transform = `scale(${scale})`;
        }

        // Call on load and resize
        window.addEventListener('resize', scaleIframe);
        window.addEventListener('load', () => {
            scaleIframe();
            // Ensure glow is visible
            document.querySelector('.frame-wrapper').style.overflow = 'visible';
        });
        window.addEventListener('orientationchange', () => {
            setTimeout(scaleIframe, 100);
        });

        // Load first slide or from hash
        const hash = window.location.hash.substring(1);
        const hashIndex = slides.indexOf(hash);
        if (hashIndex !== -1) {
            currentIndex = hashIndex;
        }
        loadSlide(currentIndex);
        
        // Initial scale
        setTimeout(scaleIframe, 100);
    </script>
</body>
</html>
